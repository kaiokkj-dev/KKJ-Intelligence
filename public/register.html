<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | KKJ Intelligence</title>
  <link rel="icon" type="image/png" href="/img1.png" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/auth.css" />
  <link rel="stylesheet" href="/global.css" />
</head>
<body class="auth-page">
  <main class="auth-wrapper">
    <!-- TOAST -->
    <div id="error-toast" class="toast hidden">
      <span class="toast-icon">❌</span>
      <span class="toast-text"></span>
    </div>
    <!-- TOP -->
    <div class="top-area">
      <strong>KKJ</strong>
      <span>Intelligence</span>
      <p>Crie sua conta para continuar</p>
    </div>
    <!-- CARD -->
    <section class="auth-container">
      <h2>Cadastro</h2>
      <p class="auth-subtitle">
        Digite suas informações para criar sua conta
      </p>
      <form id="registerForm">
        <!-- NAME -->
        <label for="name">Nome</label>
        <div class="input-box">
          <i data-lucide="user"></i>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Digite seu nome"
            required
          />
        </div>
        <!-- EMAIL -->
        <label for="email">E-mail</label>
        <div class="input-box">
          <i data-lucide="mail"></i>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
          />
        </div>
        <!-- PASSWORD -->
        <label for="password">Senha</label>
        <div class="input-box">
          <i data-lucide="lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            minlength="6"
            required
          />
          <span class="toggle-password" onclick="togglePassword('password', this)">
            <i data-lucide="eye"></i>
          </span>
        </div>
        <!-- CONFIRM PASSWORD -->
        <label for="confirmPassword">Confirmar senha</label>
        <div class="input-box">
          <i data-lucide="lock-keyhole"></i>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirme sua senha"
            minlength="6"
            required
          />
          <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">
            <i data-lucide="eye"></i>
          </span>
        </div>
        <!-- BUTTONS -->
        <div class="actions-row">
          <button type="submit" class="login-btn">
            Criar conta
          </button>
          <a href="/api/auth/google" class="google-btn">
            <img
              src="https://www.svgrepo.com/show/475656/google-color.svg"
              alt="Google"
            />
          </a>
        </div>
      </form>
    </section>
    <!-- LINK -->
    <p class="auth-link">
      JÁ TEM CONTA?
      <a href="./login.html">ENTRAR</a>
    </p>
  </main>
<script>
const form = document.getElementById("registerForm");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;
  // VALIDAR SENHAS
  if (password !== confirmPassword) {
    showToast("As senhas não coincidem", false);
    return;
  }
  try {
    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        name,
        email,
        password,
      }),
    });
    const data = await response.json();
    if (!data.success) {
      showToast(data.message, false);
      return;
    }
    showToast("Conta criada com sucesso", true);
    setTimeout(() => {
      window.location.href = "/login.html";
    }, 1500);
  } catch (err) {
    showToast("Erro interno do servidor", false);
  }
}
);
lucide.createIcons();
function togglePassword(inputId, element) {
  const input = document.getElementById(inputId);
  const icon = element.querySelector("svg");
  if (input.type === "password") {
    input.type = "text";
    element.innerHTML =
      '<i data-lucide="eye-off"></i>';
  } else {
    input.type = "password";
    element.innerHTML =
      '<i data-lucide="eye"></i>';
  }
  lucide.createIcons();
}
/* =========================
TOAST
========================= */
function showToast(message, success = true) {
  const toast = document.getElementById("error-toast");
  const text = toast.querySelector(".toast-text");
  const icon = toast.querySelector(".toast-icon");
  text.textContent = message;
  icon.textContent = success ? "✅" : "❌";
  toast.classList.remove("hidden");
  setTimeout(() => {
    toast.classList.add("hidden");
  }, 3000);
}
</script>
</body>
</html>
