<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chat | KKJ Intelligence</title>
  <link rel="icon" type="image/png" href="/img3.png" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="/global.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>

<body class="app-page">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <strong>KKJ</strong>
        <span>Intelligence</span>
      </div>
      <button class="new-chat-btn">
        <i data-lucide="plus"></i>
        Novo chat
      </button>
      <div class="chat-list">
        <p class="sidebar-label">Chats recentes</p>

        <button class="chat-item active">
          <i data-lucide="message-square"></i>
          Primeiro chat
        </button>

        <button class="chat-item">
          <i data-lucide="message-square"></i>
          Nova conversa
        </button>
      </div>
    </div>

    <div class="sidebar-bottom">
      <button class="side-action" id="themeToggle">
        <i data-lucide="moon"></i>
        Tema
      </button>

      <button class="side-action">
        <i data-lucide="settings"></i>
        Configurações
      </button>

      <div class="user-card">
        <div class="user-avatar">
          <i data-lucide="user"></i>
        </div>

        <div>
          <strong>Usuário</strong>
          <span id="userEmail">Logado</span>
        </div>
      </div>

      <button class="logout-btn" id="logoutBtn">
        <i data-lucide="log-out"></i>
        Sair
      </button>
    </div>
  </aside>
    <section class="messages-area" id="messages">
      <div class="welcome-box">
        <div class="welcome-icon">
          <i data-lucide="bot"></i>
        </div>
        <h2>Como posso ajudar hoje?</h2>
        <p>Digite sua pergunta abaixo para começar.</p>
      </div>
    </section>
    <form class="message-form" id="chatForm">
      <div class="message-input-box">
        <input
          type="text"
          id="userMessage"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
        />
        <button type="submit">
          <i data-lucide="send"></i>
        </button>
      </div>
              <p class="chat-warning">
  KKJ Intelligence utiliza modelos da OpenAI.
  Como toda IA, respostas imprecisas podem ocorrer.
  Revise informações importantes.
</p>
    </form>
  </main>
    <script>
    lucide.createIcons();
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "/login.html";
    }
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "/login.html";
    });
  </script>
</body>
</html>
